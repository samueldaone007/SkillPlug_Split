name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Django backend
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: ci-secret-key-do-not-use-in-production
      ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SETTINGS_MODULE: skillplug.settings
      DB_NAME: skillplug
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillplug
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

      - name: Compile validation (DRF serializers/views/channels import)
        run: python -c "import os, django; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'skillplug.settings'); django.setup(); import apps.api.views, apps.api.serializers, apps.api.urls, apps.chat.routing, apps.chat.consumers"

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build